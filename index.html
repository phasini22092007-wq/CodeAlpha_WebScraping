<!DOCTYPE html>
<html>
<head>
    <title>Travel Books Scraper</title>
</head>

<body>

    <h1>📚 Travel Books Scraper</h1>

    <p>Books collected using Python Web Scraping</p>

    <table border="1" cellpadding="10">
        <tr>
            <th>Title</th>
            <th>Price</th>
            <th>Rating</th>
            <th>Availability</th>
        </tr>

        {% for book in books %}
        <tr>
            <td>{{ book.Title }}</td>
            <td>{{ book.Price }}</td>
            <td>{{ book.Rating }}</td>
            <td>{{ book.Availability }}</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
